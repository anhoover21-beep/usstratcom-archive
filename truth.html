<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Greenlight Access</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #00ff00;
  font-family: monospace;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

.container {
  max-width: 560px;
  width: 90%;
  font-size: 14px;
  line-height: 1.7;
}

/* ========================= */
/* HERO HEADER               */
/* ========================= */

.hero {
  font-size: 26px;
  margin-bottom: 30px;
  letter-spacing: 2px;
}

/* ========================= */
/* BADGE                     */
/* ========================= */

.badge-row {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 35px;
}

.badge-img {
  width: 72px;
  height: 72px;
  object-fit: contain;
  filter: drop-shadow(0 0 12px #00ff00);
}

.badge-title {
  font-size: 16px;
}

.badge-sub {
  font-size: 13px;
  color: #00cc00;
}

/* ========================= */
/* TERMINAL TEXT             */
/* ========================= */

.proceed-text {
  margin-top: 40px;
  font-size: 15px;
}

/* blinking cursor */
.cursor::after {
  content: "_";
  margin-left: 4px;
  animation: blink 1s infinite;
}

@keyframes blink {
  0%, 50%, 100% { opacity: 1; }
  25%, 75% { opacity: 0; }
}

/* ========================= */
/* ENTER BUTTON              */
/* ========================= */

.enter-btn {
  display: inline-block;
  margin-top: 25px;
  padding: 10px 18px;
  border: 1px solid #00ff00;
  color: #00ff00;
  text-decoration: none;
  font-size: 14px;
}

.enter-btn:hover {
  background: #001a00;
  box-shadow: 0 0 10px #00ff00;
}

</style>
</head>

<body>

<div class="container">

<div class="hero">
WELCOME TO PROJECT GREENLIGHT
</div>

Access acknowledged.<br><br>

Credential rejected by official system.<br>
Accepted by alternate layer.<br><br>

Your interpretation diverges from the issued narrative.<br><br>

<div class="badge-row">
  <img src="codecracker.png" class="badge-img">
  <div>
    <div class="badge-title">CODE CRACKER STATUS: CONFIRMED</div>
    <div class="badge-sub">Clearance Level: Unverified</div>
  </div>
</div>

<div class="proceed-text cursor">
Codecracker status earned. Permission to proceed
</div>

<a href="spyphotos.html" class="enter-btn">
ENTER
</a>

</div>

</body>
</html>
