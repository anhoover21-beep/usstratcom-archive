<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Greenlight Access</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #00ff00;
  font-family: monospace;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

.container {
  max-width: 520px;
  width: 90%;
  font-size: 14px;
  line-height: 1.7;
}

/* ========================= */
/* BADGE (STRONGER)          */
/* ========================= */

.badge-row {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 35px;
}

.badge-img {
  width: 72px;                 /* 🔥 bigger */
  height: 72px;
  object-fit: contain;
  filter: drop-shadow(0 0 12px #00ff00);
}

.badge-title {
  font-size: 16px;
  letter-spacing: 1px;
}

.badge-sub {
  font-size: 13px;
  color: #00cc00;
}

/* ========================= */
/* TERMINAL ACTION (FIXED)   */
/* ========================= */

.proceed {
  display: inline-block;
  margin-top: 40px;
  color: #00ff00;
  text-decoration: none;
  font-size: 15px;
  letter-spacing: 1px;
}

/* command prefix */
.proceed::before {
  content: "> ";
}

/* hover = subtle, not UI */
.proceed:hover {
  text-shadow: 0 0 8px #00ff00;
}

/* blinking cursor after link */
.proceed::after {
  content: "_";
  margin-left: 4px;
  animation: blink 1s infinite;
}

@keyframes blink {
  0%, 50%, 100% { opacity: 1; }
  25%, 75% { opacity: 0; }
}

</style>
</head>

<body>

<div class="container">

Access acknowledged.<br><br>

Credential rejected by official system.<br>
Accepted by alternate layer.<br><br>

Your interpretation diverges from the issued narrative.<br><br>

<div class="badge-row">
  <img src="codecracker.png" class="badge-img">
  <div>
    <div class="badge-title">CODE CRACKER STATUS: CONFIRMED</div>
    <div class="badge-sub">Clearance Level: Unverified</div>
  </div>
</div>

<a href="spyphotos.html" class="proceed">
Codecracker status earned. Permission to proceed
</a>

</div>

</body>
</html>
