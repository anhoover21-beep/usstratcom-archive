<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operation Greenlight</title>

  <style>
    body {
      margin: 0;
      background-color: #0a0a0a;
      color: #d0d3d8;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      width: 480px;
      max-width: 90%;
    }

    .line {
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.6;
    }

    .prompt {
      margin-top: 30px;
      font-size: 13px;
      color: #9aa0a6;
    }

    input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid #444;
      padding: 10px 0;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    input::placeholder {
      color: #555;
    }

    #error {
      display: none;
      margin-top: 10px;
      font-size: 12px;
      color: #888;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: #d0d3d8;
      margin-left: 4px;
      animation: blink 1s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="line">The green light sees all.</div>

  <div class="line">
    To proceed, you must see what the green light sees.
  </div>

  <div class="prompt">ENTER RESPONSE</div>

  <input type="text" id="answer" autocomplete="off" autofocus>

  <div id="error">Response not recognized</div>

</div>

<script>
const input = document.getElementById("answer");
const error = document.getElementById("error");

input.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    const value = input.value.trim().toUpperCase();

    if (value === "NOT A BALLOON") {
      // Next phase (you can build this later)
      window.location.href = "truth.html";
    } else {
      error.style.display = "block";
      input.value = "";
    }
  }
});
</script>

</body>
</html>
