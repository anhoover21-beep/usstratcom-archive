<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Amber Clearance Node</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>AMBER ACCESS NODE</h1>
  <div>Secondary Authorization Required</div>
</header>

<div class="container">

  <p>
    Access to Level 2 archive materials requires official designation
    of authority pursuant to section P-55, Article L-18, sub-level W-1,2.
  </p>

  <div class="notice">
    <input type="text" id="codeInput" placeholder="Enter designation..." style="width:100%; padding:10px; font-size:16px;">
    <br><br>
    <button onclick="checkCode()" style="padding:10px 20px; font-size:16px;">Authorize</button>
    <p id="message"></p>
  </div>

</div>

<script>
function checkCode() {
  var input = document.getElementById("codeInput").value.trim().toUpperCase();

  if (input === "PROJECT MOGUL") {
    window.location.href = "archive.html";
  } else {
    document.getElementById("message").innerText = "Authorization Denied.";
  }
}
</script>

</body>
</html>
