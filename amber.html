<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amber Access Node</title>

  <style>
    body {
      margin: 0;
      background-color: #0a0f14;
      color: #d9d9d9;
      font-family: "Courier New", monospace;
    }

    .wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .terminal {
      width: 100%;
      max-width: 500px;
      border: 1px solid #1f2a35;
      padding: 30px;
      background-color: #0d131a;
    }

    .title {
      font-size: 16px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 12px;
      opacity: 0.6;
      margin-bottom: 30px;
    }

    .prompt {
      font-size: 13px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      background-color: black;
      border: 1px solid #1f2a35;
      color: #d9d9d9;
      padding: 12px;
      font-family: inherit;
      font-size: 14px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      background-color: #111a23;
      color: #d9d9d9;
      border: 1px solid #1f2a35;
      font-family: inherit;
      cursor: pointer;
    }

    button:hover {
      background-color: #16222e;
    }

    .message {
      margin-top: 15px;
      font-size: 12px;
      color: #ff6666;
      min-height: 18px;
    }
  </style>
</head>

<body>

<div class="wrapper">
  <div class="terminal">

    <div class="title">AMBER ACCESS NODE</div>
    <div class="subtitle">SECONDARY AUTHORIZATION REQUIRED</div>

    <div class="prompt">
      Enter official designation of authority pursuant to section P-55, 
      Article L-18, sub-level W-1,2
    </div>

    <input type="password" id="codeInput" placeholder="Designation required...">
    <button onclick="authorize()">AUTHORIZE</button>

    <div class="message" id="message"></div>

  </div>
</div>

<script>
  function authorize() {
    const input = document.getElementById("codeInput").value.trim().toUpperCase();
    const message = document.getElementById("message");

    message.textContent = "Verifying designation...";

    setTimeout(function() {
      if (input === "PROJECT MOGUL") {
        window.location.href = "archive.html";
      } else {
        message.textContent = "Authorization Denied.";
      }
    }, 1200);
  }
</script>

</body>
</html>
