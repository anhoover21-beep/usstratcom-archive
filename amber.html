<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limited Distribution Archive – Authorization</title>

  <style>
    body {
      margin: 0;
      background-color: #0e141b;
      color: #d9d9d9;
      font-family: "Courier New", monospace;
    }

    .wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .node {
      width: 100%;
      max-width: 520px;
      border: 1px solid #1f2a35;
      padding: 30px;
      background-color: #111822;
    }

    .title {
      font-size: 14px;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 12px;
      opacity: 0.6;
      margin-bottom: 25px;
    }

    .prompt {
      font-size: 12px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      background-color: black;
      border: 1px solid #1f2a35;
      color: #d9d9d9;
      padding: 12px;
      font-family: inherit;
      font-size: 13px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      background-color: #16222e;
      color: #d9d9d9;
      border: 1px solid #1f2a35;
      font-family: inherit;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover {
      background-color: #1b2b39;
    }

    .message {
      margin-top: 15px;
      font-size: 12px;
      color: #ff6666;
      min-height: 18px;
    }
  </style>
</head>

<body>

<div class="wrapper">
  <div class="node">

    <div class="title">LIMITED DISTRIBUTION ARCHIVE</div>
    <div class="subtitle">LEVEL 2 AUTHORIZATION REQUIRED</div>

    <div class="prompt">
      Enter official designation of authority pursuant to
      Section P-55, Article L-18, Sub-Section W-1,2.
    </div>

    <input type="password" id="codeInput" placeholder="Designation required">
    <button onclick="authorize()">AUTHORIZE</button>

    <div class="message" id="message"></div>

  </div>
</div>

<script>
  function authorize() {
    const input = document.getElementById("codeInput").value.trim().toUpperCase();
    const message = document.getElementById("message");

    message.textContent = "Verifying designation…";

    setTimeout(function() {
      if (input === "PROJECT MOGUL") {
        window.location.href = "archive.html";
      } else {
        message.textContent = "Authorization denied.";
      }
    }, 1000);
  }
</script>

</body>
</html>
