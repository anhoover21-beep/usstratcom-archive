<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovered Archive Materials</title>

<style>
body {
  margin: 0;
  background-color: #0e0e0e;
  font-family: Arial, Helvetica, sans-serif;
  color: #ddd;
}

.header {
  background: #000;
  padding: 20px;
  text-align: center;
  font-size: 14px;
  letter-spacing: 2px;
  color: #ff4444;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 30px 20px;
}

.warning {
  background: #1a1a1a;
  padding: 15px;
  border-left: 4px solid #ff4444;
  font-size: 13px;
  margin-bottom: 30px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 15px;
}

.thumb {
  cursor: pointer;
  overflow: hidden;
  background: #000;
  padding: 5px;
  transform: rotate(-1deg);
  transition: transform 0.2s ease;
}

.thumb:nth-child(even) {
  transform: rotate(1deg);
}

.thumb:hover {
  transform: scale(1.03);
}

.thumb img {
  width: 100%;
  display: block;
  filter: contrast(1.05) brightness(0.95);
}

.footer {
  margin-top: 50px;
  text-align: center;
  font-size: 11px;
  opacity: 0.5;
}

/* MODAL */

.modal {
  display: none;
  position: fixed;
  z-index: 9999;
  padding: 20px;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.95);
  box-sizing: border-box;
}

.modal img {
  max-width: 100%;
  max-height: 90vh;
  margin: auto;
  display: block;
}

.modal-close {
  position: absolute;
  top: 20px;
  right: 25px;
  font-size: 24px;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="header">
RECOVERED INTERNAL MATERIALS – SOURCE UNDISCLOSED
</div>

<div class="container">

<div class="warning">
These images were captured prior to purge protocol execution.
File cabinet access lasted approximately 47 seconds.
Some markings may not be fully legible.
</div>

<div class="grid">

  <!-- CHANGE FILENAMES BELOW TO MATCH YOUR IMAGES -->

  <div class="thumb">
    <img src="photo1.jpg" onclick="openModal(this.src)">
  </div>

  <div class="thumb">
    <img src="photo2.jpg" onclick="openModal(this.src)">
  </div>

  <div class="thumb">
    <img src="photo3.jpg" onclick="openModal(this.src)">
  </div>

  <div class="thumb">
    <img src="photo4.jpg" onclick="openModal(this.src)">
  </div>

</div>

<div class="footer">
Distribution of these materials is not authorized.<br>
Further releases pending verification.
</div>

</div>

<!-- MODAL -->

<div id="imageModal" class="modal">
  <span class="modal-close" onclick="closeModal()">&times;</span>
  <img id="modalImage">
</div>

<script>
function openModal(src) {
  document.getElementById("modalImage").src = src;
  document.getElementById("imageModal").style.display = "block";
}

function closeModal() {
  document.getElementById("imageModal").style.display = "none";
}
</script>

</body>
</html>
