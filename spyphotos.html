<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greenlight Archive Node</title>

<style>
body {
  margin: 0;
  background-color: #0a0a0a;
  font-family: Arial, Helvetica, sans-serif;
  color: #cfd3da;
}

.header {
  padding: 18px;
  text-align: center;
  font-size: 12px;
  letter-spacing: 2px;
  color: #8a8f98;
  border-bottom: 1px solid #1a1a1a;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 30px 20px;
}

.warning {
  background: #111;
  padding: 15px;
  border-left: 3px solid #2a2f36;
  font-size: 12px;
  margin-bottom: 30px;
  color: #9aa0a6;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 15px;
}

.thumb {
  cursor: pointer;
  overflow: hidden;
  background: #000;
  padding: 5px;
  transform: rotate(-1deg);
  transition: transform 0.2s ease;
}

.thumb:nth-child(even) {
  transform: rotate(1deg);
}

.thumb:hover {
  transform: scale(1.03);
}

.thumb img {
  width: 100%;
  display: block;
  filter: grayscale(100%) contrast(1.1);
}

.footer {
  margin-top: 50px;
  text-align: center;
  font-size: 11px;
  opacity: 0.4;
}

/* MODAL */

.modal {
  display: none;
  position: fixed;
  z-index: 9999;
  padding: 20px;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.96);
  box-sizing: border-box;
}

.modal img {
  max-width: 100%;
  max-height: 90vh;
  margin: auto;
  display: block;
}

.modal-close {
  position: absolute;
  top: 20px;
  right: 25px;
  font-size: 20px;
  color: #aaa;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="header">
GREENLIGHT ARCHIVE // VISUAL INDEX // UNVERIFIED MATERIAL
</div>

<div class="container">

<div class="warning">
Recovered prior to sanitization.<br>
Context not provided.
</div>

<div class="grid">

  <div class="thumb"><img src="01_Incident_Report.png" onclick="openModal(this.src)"></div>
  <div class="thumb"><img src="02_Wreckage_Photos.png" onclick="openModal(this.src)"></div>
  <div class="thumb"><img src="03_Cargo_Manifest.png" onclick="openModal(this.src)"></div>
  <div class="thumb"><img src="04_Security_Memo.png" onclick="openModal(this.src)"></div>
  <div class="thumb"><img src="05_Field_Sketch.png" onclick="openModal(this.src)"></div>
  <div class="thumb"><img src="06_Photo_of_Photos.png" onclick="openModal(this.src)"></div>
  <div class="thumb"><img src="07_Team_Roster.png" onclick="openModal(this.src)"></div>
  <div class="thumb"><img src="08_Radiological_Scan.png" onclick="openModal(this.src)"></div>

  <!-- RENAMED subtly -->
  <div class="thumb"><img src="09_Autopsy_Report.png" onclick="openModal(this.src)"></div>
  <div class="thumb"><img src="10_Autopsy_Photos.png" onclick="openModal(this.src)"></div>

  <div class="thumb"><img src="11_Directive_Cover.png" onclick="openModal(this.src)"></div>

</div>

<div class="footer">
Interpretation is not provided.
</div>

</div>

<!-- MODAL -->

<div id="imageModal" class="modal">
  <span class="modal-close" onclick="closeModal()">&times;</span>
  <img id="modalImage">
</div>

<script>
function openModal(src) {
  document.getElementById("modalImage").src = src;
  document.getElementById("imageModal").style.display = "block";
  history.pushState({modalOpen: true}, "");
}

function closeModal() {
  document.getElementById("imageModal").style.display = "none";
}

window.onpopstate = function() {
  const modal = document.getElementById("imageModal");
  if (modal.style.display === "block") {
    modal.style.display = "none";
  }
};
</script>

</body>
</html>
